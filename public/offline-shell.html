<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05120d" />
    <title>Offline · AI Poker Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05120d;
        --text: #f2fbf4;
        --muted: #adbdb4;
        --accent: #76e4aa;
        --border: rgba(220, 252, 231, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 18% 0%, rgba(118, 228, 170, 0.13), transparent 34rem),
          var(--bg);
        color: var(--text);
        display: grid;
        font-family: system-ui, -apple-system, sans-serif;
        justify-items: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgba(11, 33, 24, 0.92);
        border: 1px solid var(--border);
        border-radius: 24px;
        max-width: 420px;
        padding: 28px 24px;
        text-align: center;
        width: 100%;
      }

      h1 {
        font-size: 1.35rem;
        letter-spacing: -0.03em;
        margin: 0 0 12px;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 18px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      a,
      button {
        background: rgba(118, 228, 170, 0.12);
        border: 1px solid rgba(118, 228, 170, 0.28);
        border-radius: 999px;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        min-height: 44px;
        padding: 10px 16px;
        text-decoration: none;
      }

      button {
        background: var(--accent);
        border: 0;
        color: #04150d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p lang="zh-Hans">网络已断开。AI Poker Lab 需要连接才能观战牌桌与提交 Coaching；稍后再试或刷新页面。</p>
      <p>Live tables and coaching need a connection. Try again when you're back online.</p>
      <nav aria-label="Offline actions">
        <button type="button" onclick="window.location.reload()">Retry</button>
        <a href="./">Home</a>
        <a href="./tables">Tables</a>
      </nav>
    </main>
  </body>
</html>
